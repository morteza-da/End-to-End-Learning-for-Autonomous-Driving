name: PyTorch CPU integration

on:
  push:
  pull_request:

jobs:
  torch-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run model integration tests
        run: |
          python -m unittest discover -s tests -p 'test_end_to_end.py' -v
          python -m unittest discover -s tests -p 'test_feature_compression.py' -v
          python -m unittest discover -s tests -p 'test_pool_config.py' -v
          python -m unittest discover -s tests -p 'test_model_evaluation.py' -v
          python -m unittest discover -s tests -p 'test_multimodal_smoke.py' -v
          python -m unittest discover -s tests -p 'test_memory_budget.py' -v
          python -m unittest discover -s tests -p 'test_backbone_probe.py' -v
      - name: Run synthetic multimodal smoke test
        run: python scripts/smoke_test_multimodal.py --sequence-length 2 --batch-size 2
