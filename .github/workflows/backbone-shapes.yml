name: Real backbone shape probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/autonomous_driving/backbone_extraction.py'
      - 'src/autonomous_driving/backbone_config.py'
      - 'src/autonomous_driving/backbone_probe.py'
      - 'scripts/probe_backbones.py'
      - '.github/workflows/backbone-shapes.yml'

jobs:
  measure-backbone-shapes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install timm
          python -m pip install -e .
      - name: Verify compatible PyTorch and torchvision operators
        run: |
          python -c "import torch, torchvision; print(torch.__version__, torchvision.__version__); print(torch.ops.torchvision.nms)"
      - name: Record installed model registry
        run: |
          python -c "import timm, torch; print('timm', timm.__version__); print('torch', torch.__version__); print('xception candidates:', timm.list_models('*xception*')); print('resnext candidates:', timm.list_models('*resnext50*'))"
      - name: Measure configuration A
        run: python scripts/probe_backbones.py --assignment A --output results/backbone-A.json
      - name: Measure configuration B
        run: python scripts/probe_backbones.py --assignment B --output results/backbone-B.json
      - name: Upload machine-readable measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backbone-shape-probe
          path: results/backbone-*.json
          if-no-files-found: warn
