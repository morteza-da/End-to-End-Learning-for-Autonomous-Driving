name: Python unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Check README local links
        run: python scripts/check_readme_links.py
      - name: Check reachable Git history paths
        run: python scripts/check_git_history.py
      - name: Check tracked public files
        run: python scripts/check_public_files.py
      - name: Run synthetic-fixture unit tests
        run: python -m unittest discover -s tests -v
