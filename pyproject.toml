[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-driving-multimodal"
version = "0.1.0"
description = "Multimodal camera–LiDAR learning for steering and speed prediction"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["numpy>=1.24", "Pillow>=10", "laspy>=2.5"]
model = ["torch>=2.2", "timm>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
